# Production Traefik TLS overlay (Let's Encrypt)
#
# Prerequisites:
#   - DNS A/AAAA records for APP_HOST and API_HOST pointing at this host
#   - Ports 80 and 443 reachable from the internet
#   - Set DOMAIN email in .env
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.traefik.tls.yml up -d --build
#
# Example .env:
#   ACME_EMAIL=ops@example.com
#   APP_HOST=app.example.com
#   API_HOST=api.example.com
#   NEXT_PUBLIC_API_URL=https://api.example.com
#   CORS_ORIGINS=https://app.example.com

services:
  traefik:
    image: traefik:v3.3
    container_name: quantum-fintek-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=quantum-net
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-ops@example.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --api.dashboard=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - quantum-net

  api:
    labels:
      - traefik.enable=true
      - traefik.docker.network=quantum-net
      - traefik.http.routers.api.rule=Host(`${API_HOST:-api.example.com}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.routers.api.service=api-svc
      - traefik.http.services.api-svc.loadbalancer.server.port=8000

  web:
    labels:
      - traefik.enable=true
      - traefik.docker.network=quantum-net
      - traefik.http.routers.web.rule=Host(`${APP_HOST:-app.example.com}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.routers.web.service=web-svc
      - traefik.http.services.web-svc.loadbalancer.server.port=3000

volumes:
  traefik_letsencrypt:
