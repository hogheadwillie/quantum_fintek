[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qf-security"
version = "0.1.0"
description = "QuantumFintek shared security utilities"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.0",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest", "freezegun"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
