name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install -U pip
          pip install -e packages/quant-core
          pip install -e packages/ai-intel
          pip install pytest numpy scikit-learn scipy
      - name: Unit tests
        run: pytest -q tests/

  api-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API deps
        run: |
          python -m pip install -U pip
          pip install -r apps/api/requirements.txt
          pip install -e packages/quant-core -e packages/ai-intel
      - name: Compile API
        run: python -m compileall -q apps/api/app

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
