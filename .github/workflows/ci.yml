name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install -U pip
          pip install -e packages/quant-core
          pip install -e packages/ai-intel
          pip install -e "packages/security[dev]"
          pip install -e "packages/zos-bridge[dev]"
          pip install pytest numpy scikit-learn scipy sqlalchemy fakeredis
      - name: Unit tests
        run: pytest -q tests/ packages/security/tests/ packages/zos-bridge/tests/

  api-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API deps
        run: |
          python -m pip install -U pip
          pip install -r apps/api/requirements.txt
          pip install -e packages/quant-core -e packages/ai-intel -e packages/security -e packages/zos-bridge
      - name: Compile API
        run: python -m compileall -q apps/api/app

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip pyright
          pip install -e packages/quant-core -e packages/ai-intel -e "packages/security[dev]" -e "packages/zos-bridge[dev]"
      - name: Type check packages
        run: |
          pyright packages/quant-core/src
          pyright packages/ai-intel/src
          pyright packages/security/src
          pyright packages/zos-bridge/src

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Type check
        run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
