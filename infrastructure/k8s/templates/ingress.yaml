{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "quantum-fintek.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "quantum-fintek.labels" . | nindent 4 }}
  annotations:
    {{- range $k, $v := .Values.ingress.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.hosts.api.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.hosts.api.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "quantum-fintek.fullname" . }}-api
                port:
                  name: http
    - host: {{ .Values.ingress.hosts.web.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.hosts.web.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "quantum-fintek.fullname" . }}-web
                port:
                  name: http
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
{{- end }}
